<!DOCTYPE html>
<html lang="kaa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Intizamli AI Ofis</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>

/* VOICE: túngi "Mission Control" — qarańǵı, tınısh, jıltıraǵan monitorlar, tiri agentler
   IDEA: joqarıdan qaraǵan piksel ofis etajı: bólmeler, koridorlar; agentler jaǵdayına qarap bólmeden bólmege júredi
   PICTURE: 9 bólmeli etaj (brifing, jıynalıs, tastıyıqlaw, sabaqlıqlar, jumıs zonası, basqarıw orayı, dem alıw, as úy, server)
   COLOUR and TYPE: kómir #0c0d12, tas eden #262833, kók monitor jaqtılıǵı #3fa0ff, fiolet bólme shegarası #7c6cff, jasıl LIVE #2fd27a; Pixelify Sans + Golos Text + JetBrains Mono
   LAYOUT: shepte agentler dizimi, ortada etaj planı, ońda terminal-lenta; 1100px-den tómen ústi-ústine */
:root{color-scheme:dark;--bg:#0c0d12;--pan:#13141b;--pan2:#1b1d27;--ink:#e9ebf3;--mut:#8b90a8;--line:#272a38;--red:#e0443c;--g:#2fd27a;--vio:#7c6cff;--amb:#f2b632}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Golos Text",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer}
.bar{display:flex;align-items:center;gap:12px;padding:10px max(1.5vw,12px);background:var(--pan);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:700 17px "Golos Text",system-ui,sans-serif;white-space:nowrap}
.live{color:var(--g);font-size:13px;font-weight:600;white-space:nowrap}.live::before{content:"● "}
.task{flex:1 1 160px;font-size:13.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task b{color:#b9b0ff;font-weight:600}
.data{font-size:12px;padding:5px 9px;border-radius:6px;background:#3a2a10;color:#ffd99a;white-space:nowrap;border:1px solid #5a4215}
.data.ok{background:#10301f;color:#8ff0b5;border-color:#1d5a37}
.tbtn{background:var(--pan2);border:1px solid var(--line);color:var(--ink);border-radius:8px;min-height:38px;padding:0 12px;font-weight:600;font-size:13.5px}
.tbtn:hover{border-color:var(--vio)}
.tbtn.scan{background:#3a2a0c;border-color:#8a6a2a;color:#ffd98a}
.dep,.auto{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.dep input{width:84px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 8px;font:14px "JetBrains Mono",monospace}
.auto input{width:18px;height:18px;accent-color:#e8ba5c}
.timer{font:600 20px "JetBrains Mono",monospace;color:var(--amb);background:#2a2110;border:1px solid #5a4215;border-radius:6px;padding:2px 10px}
.main{display:grid;grid-template-columns:220px minmax(0,1fr) 360px;max-width:1700px;margin:0 auto;align-items:start}
.roster{padding:12px 10px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0}
.ag{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 8px;align-items:center;background:var(--pan2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;text-align:left;color:var(--ink);width:100%}
.ag:hover{border-color:var(--vio)}
.ag .fc{grid-row:span 2;width:30px;height:30px;border-radius:7px;background:#0f1016;display:grid;place-items:center;overflow:hidden}
.ag b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ag em{font-style:normal;font-size:11px;color:var(--mut);text-align:right;white-space:nowrap}
.ag small{grid-column:2/4;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag small::before{content:"●";margin-right:5px;color:var(--sc,#6b7088)}
.wrapO{padding:12px 6px}
.office{position:relative;width:100%;aspect-ratio:10/9;background:#08090d;border:2px solid #1d1f2b;border-radius:10px;overflow:hidden;font-size:10px}
.office svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rl{position:absolute;font:600 1.05em "JetBrains Mono",monospace;color:#9aa0c0;letter-spacing:.04em;pointer-events:none;white-space:nowrap}
.rl.on{color:#cfc8ff}
.rb{position:absolute;border:1px solid transparent;border-radius:4px;pointer-events:none;transition:border-color .4s,box-shadow .4s}
.rb.on{border-color:rgba(124,108,255,.85);box-shadow:inset 0 0 0 1px rgba(124,108,255,.25),0 0 12px rgba(124,108,255,.25)}
.ch{position:absolute;width:2.6em;height:3.6em;margin:-3.4em 0 0 -1.3em;z-index:3;cursor:pointer;transition-property:left,top;transition-timing-function:linear}
.ch .hr{position:absolute;left:.55em;top:.1em;width:1.5em;height:.7em;background:var(--hair);border-radius:.35em .35em 0 0}
.ch .hd{position:absolute;left:.6em;top:.45em;width:1.4em;height:1.15em;background:#efc08c;border-radius:.2em;box-shadow:inset 0 .3em 0 var(--hair)}
.ch .hd::before,.ch .hd::after{content:"";position:absolute;top:.6em;width:.18em;height:.22em;background:#1d140e}
.ch .hd::before{left:.33em}.ch .hd::after{right:.33em}
.ch .bd{position:absolute;left:.35em;top:1.6em;width:1.9em;height:1.25em;background:var(--c);border-radius:.6em .6em .15em .15em;box-shadow:inset 0 -.25em 0 rgba(0,0,0,.25)}
.ch .lg{position:absolute;left:.7em;top:2.8em;width:1.2em;height:.55em;background:linear-gradient(90deg,#20222e 0 40%,transparent 40% 60%,#20222e 60%)}
.ch.walk .lg{animation:st .28s steps(2) infinite}
@keyframes st{50%{transform:scaleX(-1) translateY(-.08em)}}
.ch .nm{position:absolute;top:3.45em;left:50%;transform:translateX(-50%);font:600 1em "Golos Text",sans-serif;color:#dfe2f0;white-space:nowrap;text-shadow:0 1px 2px #000}
.ch .pl{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-.2em);font:500 .95em "Golos Text",sans-serif;background:#2a2560;color:#d9d4ff;border:1px solid #5f53d6;border-radius:.6em;padding:.05em .55em;white-space:nowrap}
.ch .bb{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-2.1em);background:#fff;color:#151621;border-radius:.5em;padding:.2em .6em;font:500 1.05em "Golos Text",sans-serif;white-space:nowrap;max-width:20em;overflow:hidden;text-overflow:ellipsis;display:none;box-shadow:0 2px 0 #000}
.ch .bb.on{display:block}
.ch .pp{position:absolute;right:-.5em;top:1.7em;width:.8em;height:1em;background:#f4f4f4;border:1px solid #333;display:none}
.ch.carry .pp{display:block}
.ch .ok{position:absolute;right:-.6em;top:.1em;width:1.1em;height:1.1em;border-radius:50%;background:var(--g);color:#06140d;font-size:.8em;line-height:1.1em;text-align:center;font-weight:700;display:none}
.ch.done .ok{display:block}
.ch.sit .lg{display:none}.ch.sit{margin-top:-3em}
.ch .pr{position:absolute;left:2.1em;top:2em;display:none}
.ch.cup .pr{display:block;width:.7em;height:.75em;background:#f4efe6;border-radius:0 0 .2em .2em;box-shadow:inset 0 .18em 0 #6b3e1f,.25em .15em 0 -.12em #f4efe6}
.ch.food .pr{display:block;width:1.3em;height:.7em;left:1.9em;background:radial-gradient(circle at 50% 50%,#e8b04a 0 .22em,#c8552f .23em .32em,#f4f4f4 .33em);border-radius:50%}
.ch.work .bd{box-shadow:0 0 .8em var(--c)}
@media (prefers-reduced-motion:reduce){.ch{transition:none!important}.ch.walk .lg{animation:none}}
.side{background:var(--pan);border-left:1px solid var(--line);display:flex;flex-direction:column;height:calc(100vh - 60px);min-height:560px;position:sticky;top:0}
.side h2{font:600 12px "JetBrains Mono",monospace;color:var(--g);margin:0;padding:12px 14px 8px;letter-spacing:.06em}
.feed{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:7px}
.it{background:#0f1016;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;overflow-wrap:anywhere}
.it .who{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace}
.it .who i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.it .who span{color:var(--mut);font-weight:400}
.it .tx{margin-top:3px;max-height:110px;overflow:hidden;opacity:.93}
.it.open .tx{max-height:none}
.it .more{background:none;border:0;color:#a79cff;padding:4px 0 0;font-size:12.5px}
.it.tool{border-style:dashed;font:12px "JetBrains Mono",monospace;color:#8ff0b5;padding:5px 9px}
.empt{color:var(--mut);font-size:13.5px;padding:6px 4px}
form.ask{border-top:1px solid var(--line);padding:10px 12px 12px;display:grid;gap:8px}
.chipr{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chipr button{flex:none;background:var(--pan2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:12.5px}
.row{display:flex;gap:6px;align-items:flex-end}
textarea{flex:1;resize:none;font:16px/1.4 "Golos Text",sans-serif;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;max-height:140px}
textarea:focus,button:focus-visible,input:focus,select:focus{outline:2px solid var(--vio);outline-offset:1px}
.ib{min-width:44px;min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--pan2);color:var(--ink);display:grid;place-items:center;font-size:18px}
.ib.rec{background:var(--red);color:#fff;border-color:var(--red)}
.go{min-height:44px;border:0;border-radius:9px;background:var(--vio);color:#fff;font-weight:700;padding:0 16px}
.go.stop{background:#555a73}
.att{font-size:12px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin:0}
.modal{position:fixed;inset:0;background:rgba(5,6,12,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column}
.card>.ch,.card .chd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:static;width:auto;height:auto;margin:0;cursor:default}
.card .chd h3{margin:0;font:700 17px "Golos Text",system-ui,sans-serif;flex:1}
.cb{overflow-y:auto;padding:14px 18px;flex:1}
.btn{background:var(--pan2);border:1px solid var(--line);color:var(--ink);border-radius:9px;min-height:38px;padding:0 12px;font-size:14px}
.md h4{font-size:16px;margin:12px 0 4px}.md p{margin:6px 0}.md ul,.md ol{margin:6px 0;padding-left:22px}
.md table{border-collapse:collapse;font-size:13.5px;margin:8px 0;display:block;overflow-x:auto}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;text-align:left}
.md code{background:var(--pan2);padding:1px 5px;border-radius:5px}
.md pre{background:var(--bg);padding:10px;border-radius:8px;overflow-x:auto;font-size:13px}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;background:var(--pan2);border:1px solid var(--line)}
.msg.u{background:#2a2470;color:#fff;border:0;margin-left:15%;white-space:pre-wrap}
.off{display:none;background:#3a2a10;color:#ffd99a;padding:8px 12px;font-size:13px}
.ed{display:grid;gap:10px}
.er{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:start;background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:10px}
.er textarea{grid-column:1/-1;min-height:70px;font-size:14px}
.er input[type=text],.fm input,.fm select{font:15px "Golos Text",system-ui,sans-serif;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:42px}
.er input[type=color]{width:44px;height:42px;border:0;background:none;padding:0}
.er .k{grid-column:1/-1;font-size:12px;color:var(--mut)}
.lw{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;min-height:50vh}
.ll{display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);padding-right:12px;overflow-y:auto;max-height:70vh}
.ll button{text-align:left;background:var(--pan2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:14px}
.ll button.on{border-color:var(--vio);background:#2a2470;color:#fff}
.ll small{display:block;color:var(--mut);font-size:12px}.ll button.on small{color:#cfd0ff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{background:var(--pan2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px}
.tabs button[aria-pressed=true]{background:var(--vio);color:#fff;border-color:var(--vio)}
.fm{display:grid;gap:8px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
@media(max-width:1300px){.main{grid-template-columns:190px minmax(0,1fr) 320px}}
@media(max-width:1100px){.main{grid-template-columns:minmax(0,1fr)}.roster{position:static;flex-direction:row;overflow-x:auto;padding:10px}.ag{width:180px;flex:none}.side{position:static;height:auto;min-height:0;border-left:0;border-top:1px solid var(--line)}.feed{max-height:360px}}
@media(max-width:700px){.lw{grid-template-columns:minmax(0,1fr)}.ll{border-right:0;padding-right:0;max-height:30vh}.er{grid-template-columns:44px minmax(0,1fr) auto}.er input.rr{grid-column:1/-1}.ch .pl{display:none}.data{display:none}}

/* --- Mini App --- */
body{padding-bottom:env(safe-area-inset-bottom)}
.bar{padding:10px 12px;gap:10px}
.bar .brand{font-size:15px}
.mainM{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.roster{position:static;flex-direction:row;overflow-x:auto;padding:8px 10px;gap:6px}
.roster .ag{width:150px;flex:none;padding:6px 8px}
.wrapO{padding:6px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}

.qb{display:flex;gap:6px;overflow-x:auto}
.qb button{flex:none;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--pan2);color:var(--ink);padding:0 12px;font:600 13px "Golos Text",sans-serif}
.qb button.gold{background:#3a2a0c;border-color:#8a6a2a;color:#ffd98a}
.feedM{background:var(--pan);border-top:1px solid var(--line);padding:8px 10px;min-height:200px}
.feedM h2{font:600 12px "JetBrains Mono",monospace;color:var(--g);margin:4px 0 8px}
#feed{max-height:none;overflow:visible;padding:0}
.err{display:none;background:#3a1414;color:#ffb4b4;padding:10px 12px;font-size:13.5px}
.err.on{display:block}
.ch .pl{font-size:.9em}
</style>
</head>
<body>
<div class="err" id="err"></div>
<header class="bar">
  <img id="hlogo" alt="" width="30" height="30" style="border-radius:50%;flex:none">

<script>
{
const TG=window.Telegram&&Telegram.WebApp;if(TG){TG.ready();TG.expand();try{TG.setHeaderColor("#13141b");TG.setBackgroundColor("#0c0d12")}catch(e){}}
const P=new URLSearchParams(location.search);let API=P.get("api")||"";try{if(API)localStorage.setItem("ao_api",API);else API=localStorage.getItem("ao_api")||""}catch(e){}

let TEAM=[];
const by=()=>Object.fromEntries(TEAM.map(a=>[a.id,a]));
const kind=k=>TEAM.find(a=>a.k===k)||TEAM.find(a=>a.k==="boss");
const IDLE_OLD={picker:["Ballardı salıstırıp atırman"],volume:["Kólemdi qarap atırman"],liq:["Teń tóbelerdi belgilep atırman"],whale:["DXY ti baqlap atırman"],swap:["Korrelyaciya esaplap atırman"],risk:["Risk birinshi orında"],sizer:["Lot esaplap atırman"],stop:["Stoplar ornında"],tp:["TP dárejeleri tayın"],exec:["Order kartası tayın tur"],content:["Kontent reje dúzip atırman","Reels ideyası bar!","Telegram postın tayarlap atırman"],signal:["Grafikti kórip atırman","Taymfreymlerdi tekserip atırman"],mentor:["Sabaqlıq jazıp atırman","Test dúzip atırman"],boss:["Komandanı baqlap atırman","Tapsırma kútip atırman"],news:["Kalendardı oqıp atırman"],stock:["Otchetlardı oqıp atırman"],acc:["Esaplar tártipte"],law:["Shártnama oqıp atırman"],video:["Ssenariy oylap atırman"],edit:["Taymlayn tazalap atırman"],check:["Sapa — birinshi orında"]};

async function poll(){try{const j=await api("/api/events?since="+since);err("");for(const e of j.events||[]){since=Math.max(since,e.id);onEvent(e)}$("#live").textContent="LIVE"}catch(e){err(e.message);$("#live").textContent="OFFLINE"}}
async function boot(){$("#hlogo").src=LOGO;
 try{const t=await api("/api/team");TEAM=t.team.map(a=>({...a,c:(COL[a.k]||{}).c||"#7c6cff",h:(COL[a.k]||{}).h||"#2a1d14"}));since=t.last||0;renderOffice();$("#taskT").textContent=(t.user?t.user+", ":"")+"tapsırma kútilip tur";err("")}
 catch(e){err(e.message);$("#taskT").textContent="Jalǵanbadı";return}
 setInterval(poll,1500)}
async function act(a){const q=$("#q").value.trim();
 if(a==="pos"){try{const j=await api("/api/positions");post({n:"MT5",r:"DEMO",c:"#2fd27a"},j.text||"")}catch(e){err(e.message)}return}
 if(["aksiya","kontent","sabaq"].includes(a)&&!q){$("#q").dataset.act=a;$("#q").placeholder={aksiya:"Qaysı akciya / soraw?",kontent:"Qanday kontent kerek?",sabaq:"Sabaqlıq teması | Dáreje"}[a];$("#q").focus();return}
 try{await api("/api/do",{method:"POST",body:JSON.stringify({action:a,text:q})});$("#q").value="";$("#q").dataset.act="";if(TG&&TG.HapticFeedback)TG.HapticFeedback.impactOccurred("light")}catch(e){err(e.message)}}
document.querySelectorAll(".qb button").forEach(b=>b.onclick=()=>act(b.dataset.a));
$("#ask").addEventListener("submit",e=>{e.preventDefault();const a=$("#q").dataset.act||"task";if(!$("#q").value.trim())return;act(a)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#ask").requestSubmit()}});
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest(".modal").classList.remove("on"));
$("#rcopy").onclick=async()=>{try{await navigator.clipboard.writeText($("#rbody").innerText);$("#rcopy").textContent="Kóshirildi ✓"}catch(e){}};
boot();
}
</script>
</body>
</html>
