<!DOCTYPE html>
<html lang="kaa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Intizamli AI Ofis</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>

/* VOICE: túngi "Mission Control" — qarańǵı, tınısh, jıltıraǵan monitorlar, tiri agentler
   IDEA: joqarıdan qaraǵan piksel ofis etajı: bólmeler, koridorlar; agentler jaǵdayına qarap bólmeden bólmege júredi
   PICTURE: 9 bólmeli etaj (brifing, jıynalıs, tastıyıqlaw, sabaqlıqlar, jumıs zonası, basqarıw orayı, dem alıw, as úy, server)
   COLOUR and TYPE: kómir #0c0d12, tas eden #262833, kók monitor jaqtılıǵı #3fa0ff, fiolet bólme shegarası #7c6cff, jasıl LIVE #2fd27a; Pixelify Sans + Golos Text + JetBrains Mono
   LAYOUT: shepte agentler dizimi, ortada etaj planı, ońda terminal-lenta; 1100px-den tómen ústi-ústine */
:root{color-scheme:dark;--bg:#060912;--pan:#0a0f1d;--pan2:#101729;--ink:#eef0f6;--mut:#8f97b0;--line:#222c44;--red:#e0443c;--g:#2fd27a;--vio:#e2ad4c;--amb:#f2b632;--gold:#f0bd5a;--blue:#3fa0ff}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Golos Text",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer}
.bar{display:flex;align-items:center;gap:12px;padding:10px max(1.5vw,12px);background:var(--pan);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:700 17px "Golos Text",system-ui,sans-serif;white-space:nowrap}
.live{color:var(--g);font-size:13px;font-weight:600;white-space:nowrap}.live::before{content:"● "}
.task{flex:1 1 160px;font-size:13.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task b{color:var(--gold);font-weight:600}
.data{font-size:12px;padding:5px 9px;border-radius:6px;background:#3a2a10;color:#ffd99a;white-space:nowrap;border:1px solid #5a4215}
.data.ok{background:#10301f;color:#8ff0b5;border-color:#1d5a37}
.tbtn{background:var(--pan2);border:1px solid var(--line);color:var(--ink);border-radius:8px;min-height:38px;padding:0 12px;font-weight:600;font-size:13.5px}
.tbtn:hover{border-color:var(--vio)}
.tbtn.scan{background:#3a2a0c;border-color:#8a6a2a;color:#ffd98a}
.dep,.auto{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.dep input{width:84px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 8px;font:14px "JetBrains Mono",monospace}
.auto input{width:18px;height:18px;accent-color:#e8ba5c}
.timer{font:600 20px "JetBrains Mono",monospace;color:var(--amb);background:#2a2110;border:1px solid #5a4215;border-radius:6px;padding:2px 10px}
.main{display:grid;grid-template-columns:220px minmax(0,1fr) 360px;max-width:1700px;margin:0 auto;align-items:start}
.roster{padding:12px 10px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0}
.ag{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 8px;align-items:center;background:var(--pan2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;text-align:left;color:var(--ink);width:100%}
.ag:hover{border-color:var(--vio)}
.ag .fc{grid-row:span 2;width:30px;height:30px;border-radius:7px;background:#0f1016;display:grid;place-items:center;overflow:hidden}
.ag b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ag em{font-style:normal;font-size:11px;color:var(--mut);text-align:right;white-space:nowrap}
.ag small{grid-column:2/4;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag small::before{content:"●";margin-right:5px;color:var(--sc,#6b7088)}
.wrapO{padding:12px 6px}
.office{position:relative;width:100%;aspect-ratio:1672/941;background:#05070d;border:2px solid #3a2c12;border-radius:10px;overflow:hidden;font-size:10px;isolation:isolate;box-shadow:0 0 0 1px #000,0 0 28px rgba(240,189,90,.12)}
.rb{position:absolute;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:border-color .35s,box-shadow .35s,background .35s}
.rb:hover,.rb:focus-visible{border-color:rgba(255,205,110,.95);box-shadow:0 0 18px rgba(255,180,60,.55),inset 0 0 22px rgba(255,180,60,.22);outline:none}
.rb.on{box-shadow:inset 0 0 26px rgba(255,180,60,.20)}
.rb.hot{border-color:rgba(255,205,110,.9);box-shadow:0 0 22px rgba(255,180,60,.6),inset 0 0 30px rgba(255,180,60,.25);animation:rp 1.6s ease-in-out infinite}
@keyframes rp{50%{box-shadow:0 0 10px rgba(255,180,60,.3),inset 0 0 14px rgba(255,180,60,.12)}}
.rl{position:absolute;font:700 .95em "JetBrains Mono",monospace;color:#1a1206;background:var(--gold);border-radius:1em;padding:0 .55em;pointer-events:none;white-space:nowrap;opacity:0;transform:translate(-100%,0);box-shadow:0 0 8px rgba(240,189,90,.6)}
.rl.on{opacity:1}
.ch.idle .pl{display:none}.ch.idle:hover .pl,.ch.idle:focus-visible .pl{display:block}
.ch:hover{z-index:200!important}
.ch{position:absolute;width:2.6em;height:3.8em;margin:-3.7em 0 0 -1.3em;z-index:3;cursor:pointer;transition-property:left,top;transition-timing-function:linear;filter:drop-shadow(0 .15em .1em rgba(0,0,0,.6))}
.ch .hr{position:absolute;left:.5em;top:0;width:1.6em;height:.8em;background:var(--hair);border-radius:.45em .45em .1em .1em;z-index:2}
.ch .hr::after{content:"";position:absolute;display:var(--hs,none);left:-.15em;top:.35em;width:1.9em;height:.9em;background:var(--hair);border-radius:0 0 .5em .5em;z-index:-1}
.ch .hd{position:absolute;left:.6em;top:.4em;width:1.4em;height:1.2em;background:var(--skin);border-radius:.25em;box-shadow:inset 0 .3em 0 var(--hair)}
.ch .hd::before,.ch .hd::after{content:"";position:absolute;top:.62em;width:.18em;height:.22em;background:#1d140e}
.ch .hd::before{left:.33em}.ch .hd::after{right:.33em}
.ch .gl{position:absolute;left:.68em;top:.92em;width:1.24em;height:.3em;border:.07em solid #111;border-radius:.1em;display:var(--gls,none);z-index:3;background:linear-gradient(90deg,rgba(140,200,255,.35) 0 40%,#111 40% 60%,rgba(140,200,255,.35) 60%)}
.ch .bd{position:absolute;left:.3em;top:1.58em;width:2em;height:1.4em;background:linear-gradient(90deg,#0b0b0e 0 33%,#f4f4f4 33% 40%,var(--tie,#e8b04a) 45% 55%,#f4f4f4 60% 67%,#0b0b0e 67%);border-radius:.6em .6em .2em .2em;box-shadow:inset 0 -.22em 0 rgba(255,255,255,.06),0 0 0 .06em rgba(240,189,90,.55)}
.ch .bd::before{content:"";position:absolute;left:.72em;top:0;width:.56em;height:.32em;background:#f4f4f4;clip-path:polygon(0 0,100% 0,50% 100%)}
.ch .bd::after{content:"";position:absolute;right:.12em;top:.32em;width:.5em;height:.5em;border-radius:50%;background:#0b0b0e var(--logo) center/100% 100%;box-shadow:0 0 0 .05em var(--gold)}
.ch .lg{position:absolute;left:.68em;top:2.95em;width:1.24em;height:.6em;background:linear-gradient(90deg,#111216 0 40%,transparent 40% 60%,#111216 60%)}
.ch .lg::after{content:"";position:absolute;left:0;bottom:-.1em;width:100%;height:.16em;background:linear-gradient(90deg,#000 0 40%,transparent 40% 60%,#000 60%)}
.ch.back .bd::after{right:auto;left:.7em;top:.3em;width:.62em;height:.62em}
.ch.back .bd{background:#0b0b0e}
.ch.back .bd::before{display:none}
.ch.back .hd{box-shadow:inset 0 1.2em 0 var(--hair)}
.ch.back .gl{display:none}
.ch.walk .lg{animation:st .28s steps(2) infinite}
.ch.walk{animation:bob .28s steps(2) infinite}
@keyframes bob{50%{margin-top:-3.78em}}
@keyframes st{50%{transform:scaleX(-1) translateY(-.08em)}}
.ch .nm{position:absolute;top:3.75em;left:50%;transform:translateX(-50%);font:600 1em "Golos Text",sans-serif;color:#dfe2f0;white-space:nowrap;text-shadow:0 1px 2px #000}
.ch .pl{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-.2em);font:500 .95em "Golos Text",sans-serif;background:#1a1408;color:#ffe3a6;border:1px solid #8a6a2a;border-radius:.6em;padding:.05em .55em;white-space:nowrap}
.ch .bb{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-2.1em);background:#fff;color:#151621;border-radius:.5em;padding:.2em .6em;font:500 1.05em "Golos Text",sans-serif;white-space:nowrap;max-width:20em;overflow:hidden;text-overflow:ellipsis;display:none;box-shadow:0 2px 0 #000}
.ch .bb.on{display:block}
.ch.top .bb{bottom:auto;top:100%;transform:translate(-50%,1.5em)}
.ch .pp{position:absolute;right:-.5em;top:1.7em;width:.8em;height:1em;background:#f4f4f4;border:1px solid #333;display:none}
.ch.carry .pp{display:block}
.ch .ok{position:absolute;right:-.6em;top:.1em;width:1.1em;height:1.1em;border-radius:50%;background:var(--g);color:#06140d;font-size:.8em;line-height:1.1em;text-align:center;font-weight:700;display:none}
.ch.done .ok{display:block}
.ch.sit .lg{display:none}.ch.sit{margin-top:-3.2em}
.ch .cb{display:none;position:absolute;left:.26em;top:2.15em;width:2.08em;height:1.15em;background:#17181e;border:.1em solid #2c2e38;border-radius:.32em;z-index:4}
.ch .cb::after{content:"";position:absolute;left:50%;top:50%;width:.5em;height:.5em;margin:-.25em 0 0 -.25em;border-radius:50%;background:#0b0b0e var(--logo) center/100% 100%;box-shadow:0 0 0 .05em var(--gold)}
.ch.sit.back{margin-top:-2.95em}.ch.sit.back .cb{display:block}.ch.sit.back .nm{top:3.35em;z-index:6}
.ch.sit.back.work .hd,.ch.sit.back.work .hr{animation:nod .9s steps(2) infinite}
@keyframes nod{50%{transform:translateY(.08em)}}
.office canvas.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.ch .pr{position:absolute;left:2.1em;top:2em;display:none}
.ch.cup .pr{display:block;width:.7em;height:.75em;background:#f4efe6;border-radius:0 0 .2em .2em;box-shadow:inset 0 .18em 0 #6b3e1f,.25em .15em 0 -.12em #f4efe6}
.ch.food .pr{display:block;width:1.3em;height:.7em;left:1.9em;background:radial-gradient(circle at 50% 50%,#e8b04a 0 .22em,#c8552f .23em .32em,#f4f4f4 .33em);border-radius:50%}
.ch.work .bd{box-shadow:0 0 .7em rgba(255,190,80,.85),0 0 0 .06em var(--gold)}
.ch .tag{position:absolute;left:50%;top:3.55em;width:.5em;height:.5em;border-radius:50%;background:var(--c);transform:translateX(-50%);box-shadow:0 0 .4em var(--c)}
@media (prefers-reduced-motion:reduce){.ch{transition:none!important}.ch.walk .lg{animation:none}}
.side{background:var(--pan);border-left:1px solid var(--line);display:flex;flex-direction:column;height:calc(100vh - 60px);min-height:560px;position:sticky;top:0}
.side h2{font:600 12px "JetBrains Mono",monospace;color:var(--g);margin:0;padding:12px 14px 8px;letter-spacing:.06em}
.feed{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:7px}
.it{background:#0f1016;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;overflow-wrap:anywhere}
.it .who{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace}
.it .who i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.it .who span{color:var(--mut);font-weight:400}
.it .tx{margin-top:3px;max-height:110px;overflow:hidden;opacity:.93}
.it.open .tx{max-height:none}
.it .more{background:none;border:0;color:var(--gold);padding:4px 0 0;font-size:12.5px}
.it.tool{border-style:dashed;font:12px "JetBrains Mono",monospace;color:#8ff0b5;padding:5px 9px}
.empt{color:var(--mut);font-size:13.5px;padding:6px 4px}
form.ask{border-top:1px solid var(--line);padding:10px 12px 12px;display:grid;gap:8px}
.chipr{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chipr button{flex:none;background:var(--pan2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:12.5px}
.row{display:flex;gap:6px;align-items:flex-end}
textarea{flex:1;resize:none;font:16px/1.4 "Golos Text",sans-serif;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;max-height:140px}
textarea:focus,button:focus-visible,input:focus,select:focus{outline:2px solid var(--vio);outline-offset:1px}
.ib{min-width:44px;min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--pan2);color:var(--ink);display:grid;place-items:center;font-size:18px}
.ib.rec{background:var(--red);color:#fff;border-color:var(--red)}
.go{min-height:44px;border:0;border-radius:9px;background:linear-gradient(180deg,#f3c66a,#c98f2e);color:#1a1206;font-weight:700;padding:0 16px}
.go.stop{background:#555a73}
.att{font-size:12px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin:0}
.modal{position:fixed;inset:0;background:rgba(5,6,12,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column}
.card>.ch,.card .chd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:static;width:auto;height:auto;margin:0;cursor:default}
.card .chd h3{margin:0;font:700 17px "Golos Text",system-ui,sans-serif;flex:1}
.cb{overflow-y:auto;padding:14px 18px;flex:1}
.btn{background:var(--pan2);border:1px solid var(--line);color:var(--ink);border-radius:9px;min-height:38px;padding:0 12px;font-size:14px}
.md h4{font-size:16px;margin:12px 0 4px}.md p{margin:6px 0}.md ul,.md ol{margin:6px 0;padding-left:22px}
.md table{border-collapse:collapse;font-size:13.5px;margin:8px 0;display:block;overflow-x:auto}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;text-align:left}
.md code{background:var(--pan2);padding:1px 5px;border-radius:5px}
.md pre{background:var(--bg);padding:10px;border-radius:8px;overflow-x:auto;font-size:13px}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;background:var(--pan2);border:1px solid var(--line)}
.msg.u{background:#2a2470;color:#fff;border:0;margin-left:15%;white-space:pre-wrap}
.off{display:none;background:#3a2a10;color:#ffd99a;padding:8px 12px;font-size:13px}
.ed{display:grid;gap:10px}
.er{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:start;background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:10px}
.er textarea{grid-column:1/-1;min-height:70px;font-size:14px}
.er input[type=text],.fm input,.fm select{font:15px "Golos Text",system-ui,sans-serif;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:42px}
.er input[type=color]{width:44px;height:42px;border:0;background:none;padding:0}
.er .k{grid-column:1/-1;font-size:12px;color:var(--mut)}
.lw{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;min-height:50vh}
.ll{display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);padding-right:12px;overflow-y:auto;max-height:70vh}
.ll button{text-align:left;background:var(--pan2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:14px}
.ll button.on{border-color:var(--vio);background:#2a2470;color:#fff}
.ll small{display:block;color:var(--mut);font-size:12px}.ll button.on small{color:#cfd0ff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{background:var(--pan2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px}
.tabs button[aria-pressed=true]{background:var(--vio);color:#fff;border-color:var(--vio)}
.fm{display:grid;gap:8px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
@media(max-width:1300px){.main{grid-template-columns:190px minmax(0,1fr) 320px}}
@media(max-width:1100px){.main{grid-template-columns:minmax(0,1fr)}.roster{position:static;flex-direction:row;overflow-x:auto;padding:10px}.ag{width:180px;flex:none}.side{position:static;height:auto;min-height:0;border-left:0;border-top:1px solid var(--line)}.feed{max-height:360px}}
@media(max-width:700px){.lw{grid-template-columns:minmax(0,1fr)}.ll{border-right:0;padding-right:0;max-height:30vh}.er{grid-template-columns:44px minmax(0,1fr) auto}.er input.rr{grid-column:1/-1}.ch .pl{display:none}.data{display:none}}

/* --- Mini App --- */
body{padding-bottom:env(safe-area-inset-bottom)}
.bar{padding:10px 12px;gap:10px}
.bar .brand{font-size:15px}
.mainM{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.roster{position:static;flex-direction:row;overflow-x:auto;padding:8px 10px;gap:6px}
.roster .ag{width:150px;flex:none;padding:6px 8px}
.wrapO{padding:6px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.wrapO .office{min-width:880px}
.ctrl{position:sticky;bottom:0;background:var(--pan);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;gap:8px;z-index:20}
.qb{display:flex;gap:6px;overflow-x:auto}
.qb button{flex:none;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--pan2);color:var(--ink);padding:0 12px;font:600 13px "Golos Text",sans-serif}
.qb button.gold{background:#3a2a0c;border-color:#8a6a2a;color:#ffd98a}
.feedM{background:var(--pan);border-top:1px solid var(--line);padding:8px 10px;min-height:200px}
.feedM h2{font:600 12px "JetBrains Mono",monospace;color:var(--g);margin:4px 0 8px}
#feed{max-height:none;overflow:visible;padding:0}
.err{display:none;background:#3a1414;color:#ffb4b4;padding:10px 12px;font-size:13.5px}
.err.on{display:block}
.ch .pl{font-size:.9em}
</style>
</head>
<body>
<div class="err" id="err"></div>
<header class="bar">
  <img id="hlogo" alt="" width="30" height="30" style="border-radius:50%;flex:none">
  <span class="brand">Intizamli · AI Ofis</span><span class="live" id="live">LIVE</span>
  <div class="task" id="taskT">Jalǵanıp atır…</div>
  <div class="timer" id="timer">00:00</div>
</header>
<nav class="roster" id="roster" aria-label="Agentler"></nav>
<section class="wrapO"><div class="office" id="office" aria-label="Ofis etaj planı"></div></section>
<section class="feedM"><h2>● KOMANDA TERMINALI</h2><div id="feed"><div class="empt">Tapsırma jazıń yamasa tómendegi túymelerdi basıń. Nátiyje usı jerde hám Telegram chatta (kartochkalar menen) shıǵadı.</div></div></section>
<div class="ctrl">
  <div class="qb">
    <button class="gold" type="button" data-a="skaner">📊 Bazardı skanerlew</button>
    <button class="gold" type="button" data-a="firma">🏛 Treyding firması</button>
    <button type="button" data-a="signal">📈 Signal</button>
    <button type="button" data-a="janaliq">📰 Jańalıqlar</button>
    <button type="button" data-a="aksiya">💹 Akciya</button>
    <button type="button" data-a="kontent">📣 Kontent</button>
    <button type="button" data-a="sabaq">📚 Sabaqlıq</button>
    <button type="button" data-a="pos">📂 Poziciyalar</button>
    <button type="button" data-a="stop">⏹ Toqtatıw</button>
  </div>
  <form class="row" id="ask"><textarea id="q" rows="1" placeholder="Tapsırma (Signal ushın instrument: XAUUSD H4…)"></textarea><button class="go" id="go" type="submit">Jiberiw</button></form>
</div>
<div class="modal" id="dp"><div class="card" style="width:min(560px,100%)"><div class="chd"><h3 id="dpT"></h3><button class="btn" data-close type="button">Jabıw</button></div>

function openDept(k){const q=R[k];if(!q)return;$("#dpT").textContent=q.n;$("#dpD").textContent=q.d;
 const L=TEAM.filter(a=>S[a.id]&&(HOME[a.id].r===k||S[a.id].room===k));
 $("#dpL").innerHTML=L.length?L.map(a=>`<button class="ag" type="button" data-id="${esc(a.id)}"><span class="fc" style="background:${esc(a.c)}33"><b style="font-size:13px">${esc(a.n.slice(0,1))}</b></span><b>${esc(a.n)}</b><em>${esc(a.r)}</em><small>${esc(S[a.id].room===k?S[a.id].st:"basqa bólimde · "+S[a.id].st)}</small></button>`).join(""):'<p class="note">Bul bólimde házir xızmetker joq.</p>';
 $("#dp").dataset.r=k;$("#dp").classList.add("on")}
$("#dpL").addEventListener("click",e=>{const c=e.target.closest(".ag");if(c){$("#dp").classList.remove("on");openDm(c.dataset.id)}});
$("#dpCall").onclick=()=>{const k=$("#dp").dataset.r;TEAM.filter(a=>HOME[a.id]&&HOME[a.id].r===k).forEach(a=>{S[a.id].busy=1;goHome(a.id,"jumısta").then(()=>{say(a.id,"Jumıs ornımdaman!",2000);setTimeout(()=>{S[a.id].busy=0;setSt(a.id,"jumıs ornında")},6000)})});$("#dp").classList.remove("on")};
$("#dpTask").onclick=()=>{const k=$("#dp").dataset.r;const q=$("#q");q.value=`[${R[k].n}] `+q.value.replace(/^\[[^\]]*\]\s*/,"");$("#dp").classList.remove("on");q.focus()};
$("#roster").addEventListener("click",e=>{const c=e.target.closest(".ag");if(c)openDm(c.dataset.id)});
/* --- lenta --- */
const feed=$("#feed");
function post(a,txt){a=a||{n:"Siz",r:"tapsırma",c:"#7c6cff"};if(feed.querySelector(".empt"))feed.innerHTML="";const it=document.createElement("div");it.className="it";it.style.setProperty("--c",a.c);
 it.innerHTML=`<div class="who"><i></i>${esc(a.n)} <span>· ${esc(a.r)}</span></div><div class="tx md"></div><button class="more" type="button" hidden>Tolıq oqıw</button>`;
 const tx=it.querySelector(".tx"),mb=it.querySelector(".more");mb.onclick=()=>{it.classList.toggle("open");mb.textContent=it.classList.contains("open")?"Jıynaw":"Tolıq oqıw"};
 const set=t=>{tx.innerHTML=md(t);mb.hidden=tx.scrollHeight<=112;feed.scrollTop=1e9};set(txt);feed.appendChild(it);feed.scrollTop=1e9;return set}
function tlog(t){const it=document.createElement("div");it.className="it tool";it.textContent="$ "+t;feed.appendChild(it);feed.scrollTop=1e9}
function openDm(id){const a=by()[id];if(!a)return;const cmd={signal:"signal",stock:"aksiya",news:"janaliq",content:"kontent",mentor:"mentor"}[a.k];
 $("#q").value=cmd?"":"";$("#q").placeholder=`${a.n} (${a.r}) — tapsırma jazıń`;$("#q").dataset.act=cmd||"task";$("#q").focus();say(id,"Tıńlap atırman",2000)}
const err=t=>{$("#err").textContent=t;$("#err").classList.toggle("on",!!t)};
async function api(path,opt={}){if(!API)throw new Error("API adresi joq — Mini App-tı bottıń «🏢 AI Ofis» túymesi arqalı ashıń.");
 const r=await fetch(API+path,{...opt,headers:{"content-type":"application/json","x-init-data":INIT,...(opt.headers||{})}});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("Qátelik "+r.status));return j}
let bootTry=0,since=0,tStart=0,tInt=null,lastActive=null;
const tick=()=>{const s=Math.floor((Date.now()-tStart)/1000);$("#timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function onEvent(e){const a=e.agent&&by()[e.agent];
 if(e.type==="start"){running={};PART=new Set();TEAM.forEach(x=>S[x.id]&&S[x.id].el.classList.remove("done"));$("#taskT").textContent="islep atır: "+(e.title||"");tStart=Date.now();clearInterval(tInt);tInt=setInterval(tick,1000);lastActive=null;occ();return}
 if(e.type==="end"){running=null;PART=new Set();clearInterval(tInt);$("#taskT").textContent="Tapsırma kútilip tur";setTimeout(()=>TEAM.forEach(x=>{hush(x.id);goHome(x.id,"jumıs ornında")}),4000);occ();return}
 if(e.type==="msg"){post({n:e.who||"Ofis",r:"",c:"#7c6cff"},e.text||"");return}
 if(e.type==="result"){post(kind("check"),e.text||"");$("#rbody").innerHTML=md(e.text||"");$("#res").classList.add("on");return}
 if(e.type!=="status"||!a)return;
 PART.add(a.id);const t=e.text||"";
 if(t.startsWith("🔧")){tlog(t.replace(/^🔧\s*/,""));say(a.id,t.replace(/^🔧\s*FMP:\s*/,"FMP: "),2500);return}
 if(/brifing/.test(t)){setSt(a.id,"brifingte");go(a.id,"sabaq",[490+Math.random()*460,262]);say(a.id,"Brifing!",2500);return}
 if(/debatta/.test(t)){const sp={bull:[640,140],bear:[800,140]}[a.k]||[719,140];setSt(a.id,"debatta");go(a.id,"sabaq",sp);say(a.id,a.k==="bear"?"Riskler kóp!":"Ósiw ushın dálil bar!",3000);return}
 if(/risk debatı/.test(t)){const sp={tp:[70,568],sizer:[190,568],risk:[310,568]}[a.k]||[250,568];setSt(a.id,"risk debatında");go(a.id,"risk",sp);say(a.id,t.replace(/^.*risk debatı · /,"").toUpperCase(),3000);return}
 if(/qarar shıǵarıp/.test(t)&&a.k==="mentor"){setSt(a.id,"debattı baqlap tur");go(a.id,"sabaq",[719,140]);return}
 if(/kútip/.test(t)){setSt(a.id,"kútip tur");goHome(a.id);return}
 if(/tekser/.test(t)&&!/tayın/.test(t)){if(lastActive&&lastActive!==a.id){const f=lastActive;visit(f,a.id).then(()=>goHome(f))}lastActive=a.id;goHome(a.id,"tekseriwde");say(a.id,"Tekserip atırman…");return}
 if(/islep|jazıp|ballar|⏳/.test(t)){if(lastActive&&lastActive!==a.id){const f=lastActive;visit(f,a.id).then(()=>goHome(f))}lastActive=a.id;goHome(a.id,"jumısta");say(a.id,t.replace(/^⏳\s*/,""));return}
 if(/tayın|bólip|ótti|🎉/.test(t)){hush(a.id);S[a.id]&&S[a.id].el.classList.add("done");setSt(a.id,"tayın");say(a.id,t.includes("🎉")?"Tayın! Nátiyjeni kóriń ✓":"Tayın!",2500);return}
 setSt(a.id,t.slice(0,30))}
let polling=false;async function poll(){if(polling)return;polling=true;try{const j=await api("/api/events?since="+since);err("");for(const e of j.events||[]){since=Math.max(since,e.id);onEvent(e)}$("#live").textContent="LIVE"}catch(e){err(/fetch|network/i.test(e.message)?"Bot penen baylanıs úzildi — bot islep tur ma?":e.message);$("#live").textContent="OFFLINE"}finally{polling=false}}
async function boot(){$("#hlogo").src=LOGO;
 try{const t=await api("/api/team");TEAM=t.team.map(a=>({...a,c:(COL[a.k]||{}).c||"#7c6cff",h:(COL[a.k]||{}).h||"#2a1d14"}));since=t.last||0;renderOffice();requestAnimationFrame(()=>{const w=document.querySelector(".wrapO");if(w)w.scrollLeft=(w.scrollWidth-w.clientWidth)/2});$("#taskT").textContent=(t.user?t.user+", ":"")+"tapsırma kútilip tur";err("")}
 catch(e){const m=/fetch|network|load failed/i.test(e.message)?"Serverge jalǵanıp atır… (bot islep tur ma? tunnel tayarlanıwı 30–60 s alıwı múmkin)":e.message;
  err(m);$("#taskT").textContent="Qayta urınıp atır…";bootTry=(bootTry||0)+1;setTimeout(boot,Math.min(15000,3000+bootTry*2000));return}
 if(!window.__pl){window.__pl=setInterval(poll,1500)}}
async function act(a){const q=$("#q").value.trim();
 if(a==="pos"){try{const j=await api("/api/positions");post({n:"MT5",r:"DEMO",c:"#2fd27a"},j.text||"")}catch(e){err(e.message)}return}
 if(["aksiya","kontent","sabaq"].includes(a)&&!q){$("#q").dataset.act=a;$("#q").placeholder={aksiya:"Qaysı akciya / soraw?",kontent:"Qanday kontent kerek?",sabaq:"Sabaqlıq teması | Dáreje"}[a];$("#q").focus();return}
 try{await api("/api/do",{method:"POST",body:JSON.stringify({action:a,text:q})});$("#q").value="";$("#q").dataset.act="";if(TG&&TG.HapticFeedback)TG.HapticFeedback.impactOccurred("light")}catch(e){err(e.message)}}
document.querySelectorAll(".qb button").forEach(b=>b.onclick=()=>act(b.dataset.a));
$("#ask").addEventListener("submit",e=>{e.preventDefault();const a=$("#q").dataset.act||"task";if(!$("#q").value.trim())return;act(a)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#ask").requestSubmit()}});
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest(".modal").classList.remove("on"));
$("#rcopy").onclick=async()=>{try{await navigator.clipboard.writeText($("#rbody").innerText);$("#rcopy").textContent="Kóshirildi ✓"}catch(e){}};
boot();
}
</script>
</body>
</html>
